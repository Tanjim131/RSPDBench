[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rspdbench"
version = "1.0.1"
description = "Physically grounded remote-sensing product degradations for benchmarking Earth-observation models"
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Tanjim Bin Faruk" },
  { name = "Khondaker Masfiq Reza" },
  { name = "Shrideep Pallickara" },
  { name = "Sangmi Lee Pallickara" },
]
keywords = ["remote sensing", "earth observation", "robustness", "benchmark", "foundation models", "sentinel-2", "degradation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy", "torch>=1.12"]

[project.optional-dependencies]
examples = ["pandas", "scipy", "matplotlib", "pillow", "h5py", "rasterio", "scikit-image", "scikit-learn", "geobench>=1.0"]
test = ["pytest"]

[project.urls]
Homepage = "https://tanjim131.github.io/RSPDBench/"
Repository = "https://github.com/Tanjim131/RSPDBench"
Paper = "https://arxiv.org/abs/2609.23427"
Issues = "https://github.com/Tanjim131/RSPDBench/issues"

[tool.setuptools]
packages = ["rspdbench"]
